# JSON Schema (draft 2020-12) for reiny `main.yaml`, written as YAML.
# Mirrors ModuleManifest in crates/reiny-launch/src/modules.rs; the Rust
# structs win on any disagreement. Cross-field rules (run vs modules, build
# only with run, root-only keys, port wiring) are checked by reiny, not here.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: reiny main.yaml
type: object
additionalProperties: false
required: [version]
properties:
  version: { const: 2 }
  deployment: { type: string, description: "Root only. Deployment identity." }
  domain: { type: string, description: "Root only. Defaults to the deployment name." }
  providers:
    type: object
    additionalProperties: { $ref: "#/$defs/provider" }
  modules:
    type: object
    additionalProperties: { $ref: "#/$defs/moduleCall" }
  run: { $ref: "#/$defs/run" }
  build: { $ref: "#/$defs/build" }
  in: { $ref: "#/$defs/ports" }
  out: { $ref: "#/$defs/ports" }
  owned_children:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        inputs: { type: array, uniqueItems: true, items: { type: string } }
        outputs: { type: array, uniqueItems: true, items: { type: string } }
  resources:
    type: object
    additionalProperties: { $ref: "#/$defs/resource" }
  schema:
    description: "Build-time catalog for reiny-build. Never run as runtime actions."
$defs:
  port:
    type: object
    additionalProperties: false
    properties:
      type: { type: string }
      kind: { enum: [stream, rpc], default: stream }
      response: { type: string, description: "Required response type for RPC definitions." }
      qos: { enum: [reliable, sensor], default: reliable }
      retention: { enum: [volatile, last], default: volatile }
      replay: { enum: [live, last], default: live }
      buffer:
        oneOf:
          - { const: fifo }
          - type: object
            additionalProperties: false
            required: [latest]
            properties:
              latest: { type: integer, minimum: 1 }
      from:
        description: "<sibling>.<port> or in.<port>; lists are explicit stream fan-in."
        oneOf:
          - { type: string }
          - { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
  ports:
    type: object
    additionalProperties: { $ref: "#/$defs/port" }
  gitSource:
    type: object
    additionalProperties: false
    required: [git, ref]
    properties:
      git: { type: string }
      ref: { type: string }
      path: { type: string, default: "." }
  moduleCall:
    type: object
    additionalProperties: false
    required: [source]
    properties:
      source:
        oneOf:
          - { type: string, description: "Directory relative to the calling main.yaml" }
          - { $ref: "#/$defs/gitSource" }
      providers:
        type: object
        additionalProperties: { type: string }
      in: { $ref: "#/$defs/ports" }
      out: { $ref: "#/$defs/ports" }
      config: { type: string, description: "Caller-relative replacement for a leaf's run.config." }
      config_assets: { type: array, items: { type: string }, description: "Replace a leaf's assets, including with an empty list. Relative to the selected config's parent, not the caller. Omission retains app assets; nonempty assets require a selected config. Absolute paths are rejected." }
      args: { type: array, items: { type: string }, description: "Replace a leaf's args, including with an empty list." }
  provider:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { enum: [process, artifact] }
      bin_dir: { type: string, default: "." }
      zenoh_config: { type: string }
      connect: { type: array, items: { type: string } }
  run:
    type: object
    additionalProperties: false
    required: [provider, bin]
    properties:
      kind: { enum: [service, task], default: service }
      provider: { type: string }
      bin: { type: string }
      config: { type: string }
      companions: { type: array, items: { type: string }, default: [], description: "Companion binary names without an executable suffix." }
      config_assets: { type: array, items: { type: string }, default: [], description: "Relative to the selected config origin, including caller overrides. Absolute paths are rejected." }
      args: { type: array, items: { type: string } }
      restart: { enum: [manual, on_failure, always], default: manual }
      on_failure: { enum: [report, suspend_deployment], default: report }
  build:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { const: cargo }
      manifest: { type: string, default: Cargo.toml }
      package: { type: string }
      profile: { type: string, default: release }
      features: { type: array, items: { type: string } }
      default_features: { type: boolean, default: true }
      locked: { type: boolean, default: true }
  resource:
    type: object
    additionalProperties: false
    required: [type, provider, source]
    properties:
      type: { const: artifact.file }
      provider: { type: string }
      source: { type: string }
      sha256: { type: string }
