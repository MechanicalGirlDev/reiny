# ping-pong-service の cargo ワークスペース。
# calc/(server)と asker/(client)の 2 プロジェクトを束ねる。reiny 本体とは分離した独立
# ワークスペースなので、ルートの `cargo build` には巻き込まれない。
#
# 題材: 型付き request/response(`[services]`、reiny 0.4.0)。配置は ../ping-pong-workspace と同じ
# ワークスペース共有(proto と Reiny.toml がワークスペース直下に 1 つ)。
[workspace]
resolver = "2"
members = ["calc", "asker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["nop <noplab90@gmail.com>"]

[workspace.dependencies]
reiny = { path = "../../crates/reiny" }
reiny-build = { path = "../../crates/reiny-build" }
prost = "0.13"

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
