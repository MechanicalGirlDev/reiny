version: 2
schema:
  internals:
    Add:
      proto: "proto/calc.proto"
      message: "calc.Add"
    Sum:
      proto: "proto/calc.proto"
      message: "calc.Sum"
  services:
    Adder:
      request: "Add"
      response: "Sum"
  projects:
    calc:
      version: "0.1.0"
      description: "calc module"
      publications: ["Add","Sum"]
    asker:
      version: "0.1.0"
      description: "asker module"
      dependencies: ["Add","Sum"]
