version: 1
in:
  pong: { type: pong.Pong }
out:
  ping: { type: ping.Ping }
run:
  provider: process
  bin: ping
build:
  type: cargo
  manifest: Cargo.toml
  package: ping
  profile: debug
  features: []
  default_features: true
  locked: true
schema:
  project: { name: ping }
  publications:
    Ping: { proto: proto/ping.proto, message: ping.Ping }
  dependencies:
    pong: { path: ../pong }
