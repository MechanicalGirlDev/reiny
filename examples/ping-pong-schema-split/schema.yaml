version: 3
schema:
  shared_types:
    Point:
      proto: "proto/geometry/geometry.proto"
      message: "pingpong.Point"
    Ping:
      proto: "proto/msg/pingpong.proto"
      message: "pingpong.Ping"
    Pong:
      proto: "proto/msg/pingpong.proto"
      message: "pingpong.Pong"
  schema_crates:
    geometry:
      crate: "pingpong-geometry"
      protos: ["proto/geometry/geometry.proto"]
    msg:
      crate: "pingpong-msg"
      protos: ["proto/msg/pingpong.proto"]
      depends_on: ["geometry"]
  projects:
    ping:
      types: ["Ping", "Pong"]
    pong:
      types: ["Pong", "Ping"]
