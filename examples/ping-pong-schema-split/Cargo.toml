# Split schema Cargo workspace; run with reiny run main.yaml.
[workspace]
resolver = "2"
members = ["geometry", "msg", "ping", "pong"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["nop <noplab90@gmail.com>"]

[workspace.dependencies]
reiny = { path = "../../crates/reiny" }
reiny-build = { path = "../../crates/reiny-build" }
pingpong-geometry = { path = "geometry" }
pingpong-msg = { path = "msg" }
prost = "0.14"

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
