[workspace]
resolver = "2"
members = ["schema", "ping", "pong"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["nop <noplab90@gmail.com>"]

[workspace.dependencies]
reiny = { path = "../../crates/reiny" }
reiny-build = { path = "../../crates/reiny-build" }
pingpong-schema = { path = "schema" }
prost = "0.14"

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
