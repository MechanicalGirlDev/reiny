version: 3
schema:
  shared_types:
    Ping:
      proto: "proto/ping.proto"
      message: "ping.Ping"
    Pong:
      proto: "proto/pong.proto"
      message: "pong.Pong"
  schema_crates:
    messages:
      crate: "pingpong-schema"
      protos: ["proto/ping.proto", "proto/pong.proto"]
  projects:
    ping:
      types: ["Ping", "Pong"]
    pong:
      types: ["Pong", "Ping"]
