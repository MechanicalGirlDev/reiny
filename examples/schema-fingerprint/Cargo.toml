[workspace]

[package]
name = "schema-fingerprint"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
prost = "0.14"
prost-types = "0.14"
reiny-build = { path = "../../crates/reiny-build", default-features = false, features = ["descriptors"] }
reiny = { path = "../../crates/reiny", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
reiny-build = { path = "../../crates/reiny-build" }
