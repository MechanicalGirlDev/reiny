[package]
name = "reiny-launch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Declarative typed modules, pinned Git sources, Cargo artifacts and owned deployments"
keywords = ["reiny", "launcher", "process", "supervisor"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
# One strict main.yaml per module.
serde_yaml = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
reiny-core = { path = "../reiny-core", version = "0.8.0", features = ["bindings"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
getrandom = "0.3"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "job-object", "process-group", "kill-on-drop"] }
tokio = { workspace = true }

[lints]
workspace = true
