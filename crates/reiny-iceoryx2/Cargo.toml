[package]
name = "reiny-iceoryx2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "reiny Engine on iceoryx2: zero-copy shared-memory pub/sub for launches on one host"
keywords = ["reiny", "iceoryx2", "shared-memory", "ipc", "pubsub"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Engine trait と Local だけ(zenoh は引かない)。
reiny = { path = "../reiny", version = "0.6.0", default-features = false }
iceoryx2 = "0.9"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 適合テスト(`reiny::engine::conformance`)を流す。
reiny = { path = "../reiny", version = "0.6.0", default-features = false, features = ["conformance"] }
prost = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
