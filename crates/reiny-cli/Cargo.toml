[package]
name = "reiny-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "reiny CLI: scaffold grains (new/init/add), check, build, run, compress, bag, and topic/node/service introspection via the `reiny` command"
keywords = ["reiny", "cli", "scaffold", "launcher"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "reiny"
path = "src/main.rs"

[dependencies]
reiny-launch = { path = "../reiny-launch", version = "0.3.0" }
# Reiny.toml の解決・型/トピック導出(`reiny check`)と、`@schema` 応答の descriptor 読み取り
# (`reiny bag record`)。prost-build / protoc は引かない。
reiny-build = { path = "../reiny-build", version = "0.3.0", default-features = false, features = ["descriptors"] }
# `reiny bag` が grain と同じ fabric に乗るため(zenoh の再エクスポート + 起動オプション)。
reiny = { path = "../reiny", version = "0.3.0" }
mcap = { workspace = true }
# `reiny topic echo` / `reiny service call` の動的 decode / encode(`@schema` の descriptor から)。
# prost の版は reiny と同じ 0.13 系に揃える(prost-reflect 0.14 = prost 0.13)。
prost = { workspace = true }
prost-reflect = { version = "0.14", features = ["serde"] }
serde_json = "1"
ctrlc = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# topic_e2e が descriptor set を手組みする(protoc 無し)。
prost-types = { workspace = true }

[lints]
workspace = true
