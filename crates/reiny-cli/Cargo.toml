[package]
name = "reiny-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "reiny CLI: typed module plan/apply/status/stop/update, scaffolding, builds, bundles and bus introspection"
keywords = ["reiny", "cli", "scaffold", "launcher"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "reiny"
path = "src/main.rs"

[features]
# `reiny bridge iceoryx2`。iceoryx2 は Windows / macOS で libclang が要るので opt-in。
iceoryx2 = ["dep:reiny-iceoryx2"]

[dependencies]
reiny-launch = { path = "../reiny-launch", version = "0.8.0" }
# `reiny bridge serial|udp`(LinkEngine)と、その tokio runtime。
reiny-link = { path = "../reiny-link", version = "0.8.0" }
reiny-iceoryx2 = { path = "../reiny-iceoryx2", version = "0.8.0", optional = true }
tokio = { workspace = true }
# main.yaml schema validation and topic derivation for check, plus descriptor
# decoding for bus tools. This dependency does not pull in prost-build/protoc.
reiny-build = { path = "../reiny-build", version = "0.8.0", default-features = false, features = ["descriptors"] }
# `reiny bag` が launch と同じ fabric に乗るため(zenoh の再エクスポート + 起動オプション)。
reiny = { path = "../reiny", version = "0.8.0" }
mcap = { workspace = true }
# `reiny topic echo` / `reiny service call` の動的 decode / encode(`@schema` の descriptor から)。
# Keep prost on the same major as reiny (prost-reflect 0.16 = prost 0.14).
prost = { workspace = true }
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json = "1"
serde_yaml = "0.9"
getrandom = "0.3"
ctrlc = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# topic_e2e が descriptor set を手組みする(protoc 無し)。
prost-types = { workspace = true }
tempfile = "3"

[lints]
workspace = true
