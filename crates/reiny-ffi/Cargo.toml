[package]
name = "reiny-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "UniFFI and C bindings for reiny's multilingual pub/sub API"
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["zenoh"]
zenoh = ["reiny/zenoh"]
bindgen = ["uniffi/cli"]
# Opt-in exclusion only when running under Miri. Ordinary test invocations
# always execute native subprocess targets regardless of this feature.
component-ffi-skip-miri = []

[[test]]
name = "component_client"
path = "tests/component_client.rs"

[[test]]
name = "component_process"
path = "tests/component_process.rs"
required-features = ["zenoh"]

[[bin]]
name = "reiny-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
reiny = { path = "../reiny", version = "0.11.0", default-features = false }
uniffi = "=0.32.2"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true

[dev-dependencies]
prost.workspace = true
tempfile = "3"
# Network tests observe an independent ephemeral TCP listener and matching events.
zenoh = { workspace = true, features = ["unstable"] }

[lints]
workspace = true
