[package]
name = "reiny-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "reiny build helper: reads main.yaml schemas, compiles protos, and generates types and topics"
keywords = ["reiny", "build", "protobuf", "codegen", "prost"]
categories = ["development-tools::build-utils"]

[features]
# Build scripts use proto compilation by default.
# Without default features, main.yaml schema resolution and introspection remain
# available without pulling in prost-build or protoc.
default = ["compile"]
# Descriptor decoding and fingerprints do not require protoc.
descriptors = ["dep:prost", "dep:prost-types"]
compile = ["descriptors", "dep:prost-build", "dep:protoc-bin-vendored"]

[dependencies]
prost-build = { workspace = true, optional = true }
# Decode descriptors for fingerprints and schema-owned message names.
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
protoc-bin-vendored = { workspace = true, optional = true }
serde = { workspace = true }
toml = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }

[lints]
workspace = true
