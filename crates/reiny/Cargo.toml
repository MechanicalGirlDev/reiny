[package]
name = "reiny"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "reiny SDK: publish/subscribe by Rust type via Cloudy and the #[reiny::main] runtime"
keywords = ["zenoh", "pubsub", "distributed", "actor", "launch"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["zenoh"]
# 既定エンジン。切ると `Engine` trait + `Local` だけになり、他エンジンのクレートはこれに依存する。
zenoh = ["dep:zenoh"]
# `engine::conformance` を公開する。他エンジンのクレートが dev-dependency で使う(テスト専用)。
conformance = []

[dependencies]
reiny-core = { path = "../reiny-core", version = "0.5.0" }
reiny-macros = { path = "../reiny-macros", version = "0.5.0" }
prost = { workspace = true }
zenoh = { workspace = true, optional = true }
# 購読の Fifo バッファ(有界、満杯で送信側がブロック)。zenoh の FifoChannel と同じ実装。
flume = "0.12"
tokio = { workspace = true }
toml = { workspace = true }
# `--config` is YAML by default (`.toml` / `.json` by extension); all deserialize into one `toml::Table`.
# serde_yaml is archived upstream but is what zenoh already pulls in; swap for `serde_yaml_ng` with zenoh.
serde_yaml = "0.9"
serde_json = "1"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
